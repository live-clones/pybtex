[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybtex"
version = "0.26.0"
description = "A BibTeX-compatible bibliography processor in Python"
readme = "README.rst"
authors = [{ name = "Andrey Golovizin", email = "ag@sologoc.com" }]
license = "MIT"
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=3.01",
  "latexcodec>=1.0.4",
  "importlib_metadata; python_version < '3.10'",
]

[project.urls]
Homepage = "https://pybtex.org/"
Changelog = "https://docs.pybtex.org/history.html"
Documentation = "https://docs.pybtex.org/"
Repository = "https://codeberg.org/pybtex/pybtex"
"Bug tracker" = "https://codeberg.org/pybtex/pybtex/issues"

[project.scripts]
pybtex = "pybtex.__main__:main"
pybtex-convert = "pybtex.database.convert.__main__:main"
pybtex-format = "pybtex.database.format.__main__:main"

[project.entry-points."pybtex.database.input"]
bibtex = "pybtex.database.input.bibtex:Parser"
bibtexml = "pybtex.database.input.bibtexml:Parser"
yaml = "pybtex.database.input.bibyaml:Parser"

[project.entry-points."pybtex.database.input.aliases"]
bibyaml = "pybtex.database.input.bibyaml:Parser"

[project.entry-points."pybtex.database.input.suffixes"]
".bib" = "pybtex.database.input.bibtex:Parser"
".xml" = "pybtex.database.input.bibtexml:Parser"
".bibtexml" = "pybtex.database.input.bibtexml:Parser"
".bibyaml" = "pybtex.database.input.bibyaml:Parser"
".yaml" = "pybtex.database.input.bibyaml:Parser"

[project.entry-points."pybtex.database.output"]
bibtex = "pybtex.database.output.bibtex:Writer"
bibtexml = "pybtex.database.output.bibtexml:Writer"
yaml = "pybtex.database.output.bibyaml:Writer"

[project.entry-points."pybtex.database.output.aliases"]
bibyaml = "pybtex.database.output.bibyaml:Writer"

[project.entry-points."pybtex.database.output.suffixes"]
".bib" = "pybtex.database.output.bibtex:Writer"
".xml" = "pybtex.database.output.bibtexml:Writer"
".bibtexml" = "pybtex.database.output.bibtexml:Writer"
".bibyaml" = "pybtex.database.output.bibyaml:Writer"
".yaml" = "pybtex.database.output.bibyaml:Writer"

[project.entry-points."pybtex.backends"]
latex = "pybtex.backends.latex:Backend"
html = "pybtex.backends.html:Backend"
plaintext = "pybtex.backends.plaintext:Backend"
markdown = "pybtex.backends.markdown:Backend"

[project.entry-points."pybtex.backends.aliases"]
text = "pybtex.backends.plaintext:Backend"
md = "pybtex.backends.markdown:Backend"

[project.entry-points."pybtex.backends.suffixes"]
".bbl" = "pybtex.backends.latex:Backend"
".tex" = "pybtex.backends.latex:Backend"
".latex" = "pybtex.backends.latex:Backend"
".html" = "pybtex.backends.html:Backend"
".txt" = "pybtex.backends.plaintext:Backend"
".md" = "pybtex.backends.markdown:Backend"

[project.entry-points."pybtex.style.labels"]
number = "pybtex.style.labels.number:LabelStyle"
alpha = "pybtex.style.labels.alpha:LabelStyle"

[project.entry-points."pybtex.style.names"]
plain = "pybtex.style.names.plain:NameStyle"
lastfirst = "pybtex.style.names.lastfirst:NameStyle"

[project.entry-points."pybtex.style.names.aliases"]
last_first = "pybtex.style.names.lastfirst:NameStyle"

[project.entry-points."pybtex.style.sorting"]
none = "pybtex.style.sorting.none:SortingStyle"
author_year_title = "pybtex.style.sorting.author_year_title:SortingStyle"

[project.entry-points."pybtex.style.formatting"]
plain = "pybtex.style.formatting.plain:Style"
unsrt = "pybtex.style.formatting.unsrt:Style"
alpha = "pybtex.style.formatting.alpha:Style"
unsrtalpha = "pybtex.style.formatting.unsrtalpha:Style"

[dependency-groups]
dev = ["pybtex-doctools", "pytest>=7.0.1", "ruff>=0.12.7", "sphinx>=5.3.0"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--doctest-modules"]

[tool.ruff]
# include = ["src", "tests"]
lint.select = [
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle warning
  "EM",   # flakei-errmsg
  "EXE",  # flakek8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  # "S",   # flake8-bandit
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  # "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # debugger
  # "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TRY", # tryceratops
  "UP",  # pyupgrade
  "W",   # pycodestyle errok
  "YTT", # flake8-2020
]
lint.per-file-ignores."tests/*" = [
  "S101", # allow asserts in tests
]
lint.per-file-ignores."docs/*" = ["RUF012"]
lint.ignore = [
  # ignore rules conflicting with ruff format
  "W191",   # tab-indentation
  "E111",   # indentation-with-invalid-multiple
  "E114",   # indentation-with-invalid-multiple-comment
  "E117",   # over-indented
  "E501",   # line-too-long
  "D206",   # docstring-tab-indentation
  "D300",   # triple-single-quotes
  "Q000",   # bad-quotes-inline-string
  "Q001",   # bad-quotes-multiline-string
  "Q002",   # bad-quotes-docstring
  "Q003",   # avoidable-escaped-quote
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
  "ISC002", # multi-line-implicit-string-concatenation
]

[tool.uv.workspace]
members = ["docs/pybtex_doctools"]

[tool.uv.sources]
pybtex-doctools = { workspace = true }
